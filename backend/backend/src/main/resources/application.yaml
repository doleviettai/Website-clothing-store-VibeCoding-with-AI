spring:
  application:
    name: clothing-store-backend
  config:
    import:
      - optional:classpath:application-secret.yaml

  datasource:
    url: jdbc:mysql://localhost:3306/clothing_store?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: taido231105
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # update: tự động tạo/cập nhật bảng khớp entity nếu chưa có
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    repair-on-migrate: true

